  <line x1="896" y1="252" x2="1136" y2="252" stroke="#e5e7eb"/>
  <text x="896" y="276" font-family="Cambria, Times New Roman, serif" font-size="14" font-weight="600" fill="#111827">Lengths</text>
  <text x="896" y="300" font-family="Cambria, Times New Roman, serif" font-size="14" fill="#111827">L<tspan baseline-shift="sub" font-size="10">1</tspan> = a<tspan baseline-shift="sub" font-size="10">1</tspan> + b<tspan baseline-shift="sub" font-size="10">1</tspan></text>
  <text x="896" y="320" font-family="Cambria, Times New Roman, serif" font-size="14" fill="#111827">L<tspan baseline-shift="sub" font-size="10">2</tspan> = a<tspan baseline-shift="sub" font-size="10">2</tspan> + b<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="896" y="344" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">d<tspan baseline-shift="sub" font-size="10">1</tspan> : O<tspan baseline-shift="sub" font-size="10">1</tspan> rearward to P<tspan baseline-shift="sub" font-size="10">h</tspan></text>
  <text x="896" y="364" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">b<tspan baseline-shift="sub" font-size="10">1</tspan> &#x2212; d<tspan baseline-shift="sub" font-size="10">1</tspan> : R<tspan baseline-shift="sub" font-size="10">1</tspan> forward to P<tspan baseline-shift="sub" font-size="10">h</tspan></text>
  <text x="896" y="388" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">Here d<tspan baseline-shift="sub" font-size="10">1</tspan> &lt; b<tspan baseline-shift="sub" font-size="10">1</tspan>,</text>
  <text x="896" y="408" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">so P<tspan baseline-shift="sub" font-size="10">h</tspan> is ahead of R<tspan baseline-shift="sub" font-size="10">1</tspan>.</text>
  <text x="896" y="432" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">If d<tspan baseline-shift="sub" font-size="10">1</tspan> = b<tspan baseline-shift="sub" font-size="10">1</tspan>,</text>
  <text x="896" y="452" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">then P<tspan baseline-shift="sub" font-size="10">h</tspan> coincides with R<tspan baseline-shift="sub" font-size="10">1</tspan>.</text>

  <line x1="896" y1="466" x2="1136" y2="466" stroke="#e5e7eb"/>
