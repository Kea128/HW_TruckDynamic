  <text x="896" y="514" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#111827">&#x03C6; = &#x03B8;<tspan baseline-shift="sub" font-size="10">1</tspan> &#x2212; &#x03B8;<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="896" y="534" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#111827">r<tspan baseline-shift="sub" font-size="10">1</tspan> = &#x03B8;&#x0307;<tspan baseline-shift="sub" font-size="10">1</tspan>,   r<tspan baseline-shift="sub" font-size="10">2</tspan> = &#x03B8;&#x0307;<tspan baseline-shift="sub" font-size="10">2</tspan></text>
