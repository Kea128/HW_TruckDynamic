  <text x="896" y="138" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">F<tspan baseline-shift="sub" font-size="10">1</tspan>  tractor front axle</text>
  <text x="896" y="158" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">O<tspan baseline-shift="sub" font-size="10">1</tspan>  tractor CG</text>
  <text x="896" y="178" font-family="Cambria, Times New Roman, serif" font-size="13" fill="#374151">R<tspan baseline-shift="sub" font-size="10">1</tspan>  tractor rear axle</text>
